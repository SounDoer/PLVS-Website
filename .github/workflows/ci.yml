name: Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PLVS_EXPORTER_SHA: 12f9b53f9de5aed81b3738bb55fde9d8b5e2792a
  PLVS_REFERENCE_SHA: abb4e0c7b95fbf88bb2604f5676deefca6b8a437

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: SounDoer/PLVS
          ref: ${{ env.PLVS_EXPORTER_SHA }}
          path: plvs-tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: SounDoer/PLVS
          ref: ${{ env.PLVS_REFERENCE_SHA }}
          path: plvs-tools/artifacts/reference
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plvs-tools/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: plvs-tools
      - name: Export inputs from the pinned PLVS revision
        run: |
          mkdir -p artifacts
          node plvs-tools/scripts/export-website-inputs.mjs plvs-tools/artifacts/reference artifacts/inputs
      - run: npm run check -- artifacts/inputs
      - uses: actions/upload-artifact@v7
        with:
          name: plvs-website-candidate
          path: artifacts/website/
          if-no-files-found: error
